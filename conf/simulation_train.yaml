# interference params
# Assign equal probability to all three tasks. SE may still include an interfering
# speaker with SIR > 2 to emphasize the louder speaker.
se_interference:
  prob: 0.2
  sir: [2.0, 20.0]

tse_interference:
  sir: [-5.0, 5.0]

# Reverb params
reverberation:
  prob: 0.3

# Noise params
noise:
  prob: 0.8
  snr: [-5.0, 20.0]

bandwidth_limitation:
  prob: 0.3
  fs_new: [4000, 8000, 16000]
  res_type: "soxr_hq"

clipping:
  prob: 0.3
  min_quantile: [0.0, 0.1]
  max_quantile: [0.9, 1.0]

packet_loss:
  prob: 0.3
  packet_duration_ms: 20
  packet_loss_rate: [0.05, 0.25]
  max_continuous_packet_loss: 10


